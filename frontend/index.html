<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/mailbuddy.svg" />
    <link rel="alternate icon" href="/brand/mailbuddy.ico" />
    <title>MailBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP defence-in-depth for sanitized email content. Email bodies are
      sanitized in backend and frontend; this ensures that even a sanitizer
      regression cannot load remote content or inline scripts.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
